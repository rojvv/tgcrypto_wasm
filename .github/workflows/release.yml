name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2

      - working-directory: dist
        run: |
          rm -f mod.ts tgcrypto.js tgcrypto.wat
          mv mod_optimized.ts mod.ts
          mv tgcrypto_optimized.js tgcrypto.js
          mv tgcrypto_optimized.wat tgcrypto.wat
          sed 's/tgcrypto_optimized\.js/tgcrypto.js/' mod.ts > mod.ts.tmp
          mv mod.ts.tmp mod.ts

      - run: deno publish --allow-dirty
